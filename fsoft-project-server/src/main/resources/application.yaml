server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /fsoft
spring:
  devtools:
    restart:
      enabled: false
  profiles:
    active: dev
  application:
    name: fsoft-project
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:postgres.railway.internal}:${POSTGRES_PORT:5432}/${POSTGRES_DB:railway}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:MJnNgSbBNFiOeqhHgqDBhkqdAcEpXsre}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b

aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    s3:
      bucket-name: ${AWS_S3_BUCKET}
jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: ${ACCESS_TOKEN_EX}
  refresh-token-expiration: ${REFRESH_TOKEN_EX}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  grant-type: "authorization_code"

notification:
  email:
    url: ${NOTIFICATION_EMAIL_URL}
    apikey: ${NOTIFICATION_EMAIL_APIKEY}
    sender:
      name: ${NOTIFICATION_EMAIL_SENDER_NAME:FSoft Flashcards}
      email: ${NOTIFICATION_EMAIL_SENDER_EMAIL}

logging:
  level:
    root: INFO
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

fsoft-ai:
  url: ${FSOFT_AI_URL}
  internal-token: ${FSOFT_AI_INTERNAL_TOKEN}
  backend-token: ${FSOFT_AI_BACKEND_TOKEN}
