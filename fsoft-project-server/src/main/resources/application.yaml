server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /fsoft

spring:
  application:
    name: fsoft-project
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  devtools:
    restart:
      enabled: false

  ai:
    chat:
      memory:
        repository:
          jdbc:
            platform: postgresql
            initialize-schema: ALWAYS
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.groq.com/openai/v1
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}

resilience4j:
  retry:
    instances:
      aiRetry:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - org.springframework.web.client.RestClientException
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 3
        ignore-exceptions:
          - com.fivetuat.fsoftprojectserver.exceptions.AppException
jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: ${ACCESS_TOKEN_EX:259200000}
  refresh-token-expiration: ${REFRESH_TOKEN_EX:604800000}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  grant-type: "authorization_code"

notification:
  email:
    url: ${NOTIFICATION_EMAIL_URL}
    apikey: ${NOTIFICATION_EMAIL_APIKEY}
    sender:
      name: ${NOTIFICATION_EMAIL_SENDER_NAME:FSoft Flashcards}
      email: ${NOTIFICATION_EMAIL_SENDER_EMAIL}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket-name: ${AWS_S3_BUCKET:fsoft-project}

fsoft-ai:
  url: ${FSOFT_AI_URL}
  internal-token: ${FSOFT_AI_INTERNAL_TOKEN}
  backend-token: ${FSOFT_AI_BACKEND_TOKEN}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha