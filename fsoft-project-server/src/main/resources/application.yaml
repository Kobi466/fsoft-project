server:
  port: ${PORT:8080}
  servlet:
    context-path: /fsoft
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: fsoft-project
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:${POSTGRES_HOST:localhost}}:${PGPORT:${POSTGRES_PORT:5432}}/${PGDATABASE:${POSTGRES_DB:railway}}}
    username: ${PGUSER:${POSTGRES_USER:${DB_USER:postgres}}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:${DB_PASSWORD:12345678}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: ${ACCESS_TOKEN_EX}
  refresh-token-expiration: ${REFRESH_TOKEN_EX}

logging:
  level:
    root: INFO
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
